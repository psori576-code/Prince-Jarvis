kind = "mobile"
previewPath = "/android/"
title = "Prince Jarvis Android"
description = "A mobile AI assistant with voice chat, natural Hindi and Hinglish conversation, reminders, notes, and web search."
version = "1.0.0"
id = "artifacts/prince-jarvis-android"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/android/" ]
localPort = 18650

[services.development]
run = "pnpm --filter @workspace/prince-jarvis-android run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prince-jarvis-android", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/prince-jarvis-android", "run", "serve" ]

[services.env]
PORT = "18650"
BASE_PATH = "/android/"
